name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        # Lockfile resolves Symfony 8.x, which requires PHP >= 8.4.1
        php: ['8.4']

    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkdu+F8fHJxkq8xG1pGq0xQb0m0k0Q5r5y5x8=
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      TELESCOPE_ENABLED: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, curl, redis, gd, zip, intl
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Copy environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          php artisan key:generate --force --no-interaction || true

      - name: Run PHPUnit with coverage
        run: |
          mkdir -p coverage
          php -d memory_limit=1G vendor/bin/phpunit \
            --coverage-clover=coverage/clover.xml \
            --coverage-text=coverage/coverage.txt \
            --log-junit=coverage/junit.xml \
            --testdox-text=coverage/testdox.txt \
            --colors=never

      - name: Enforce coverage threshold (≥98%)
        if: always() && hashFiles('coverage/clover.xml') != ''
        id: coverage-gate
        run: |
          {
            echo "## Test coverage"
            echo ""
            echo '```'
            php scripts/check-coverage.php coverage/clover.xml 98
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish categorized test summary
        if: always()
        run: php scripts/summarize-tests.php coverage/junit.xml coverage/clover.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/clover.xml
            coverage/coverage.txt
            coverage/junit.xml
            coverage/testdox.txt
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install npm dependencies
        # --ignore-scripts: simple-line-icons postinstall needs `less` (not required for Vite).
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Build frontend assets
        run: npm run build
