# Local development overlay: bind-mount source + build frontend assets on start.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

x-app-volumes: &app-volumes
  - .:/var/www/html:cached
  - composer-cache:/tmp/composer-cache

services:
  app:
    volumes: *app-volumes
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      node:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  node:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/node:22-alpine
    pull_policy: if_not_present
    restart: "no"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - node-modules:/var/www/html/node_modules
      - npm-cache:/root/.npm
    command: ["sh", "docker/scripts/build-assets.sh"]
    networks:
      - admin-panel

  queue:
    volumes: *app-volumes
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache

  scheduler:
    volumes: *app-volumes
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache

volumes:
  node-modules:
  npm-cache:
  composer-cache:
