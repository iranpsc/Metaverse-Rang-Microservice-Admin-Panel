name: admin-panel

x-docker-registry: &docker-registry ${DOCKER_REGISTRY:-docker.arvancloud.ir}
x-php-image: &php-image admin-panel-php:local

x-app-volumes: &app-volumes
  - app-storage:/var/www/html/storage

x-php-environment: &php-environment
  REDIS_HOST: redis
  REDIS_PORT: 6379

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        DOCKER_REGISTRY: *docker-registry
    image: *php-image
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8080"
    volumes: *app-volumes
    env_file:
      - .env
    environment:
      <<: *php-environment
      APP_URL: ${APP_URL:-http://localhost:8088}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      redis:
        condition: service_healthy
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - admin-panel

  redis:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/redis:7-alpine
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - admin-panel

  queue:
    image: *php-image
    pull_policy: never
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes: *app-volumes
    env_file:
      - .env
    environment:
      <<: *php-environment
      QUEUE_CONNECTION: redis
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - queue
    networks:
      - admin-panel

  scheduler:
    image: *php-image
    pull_policy: never
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes: *app-volumes
    env_file:
      - .env
    environment:
      <<: *php-environment
    depends_on:
      app:
        condition: service_started
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - queue
    networks:
      - admin-panel

volumes:
  app-storage:

networks:
  admin-panel:
    driver: bridge
