name: ${COMPOSE_PROJECT_NAME:-admin-panel}

# Production Compose for Dokploy.
# App source, Composer vendor, and Vite assets are baked by docker/php/Dockerfile.
# Persist only Laravel storage and the SQLite database used by translations.
# MySQL lives in the microservices stack; reach it as metarang-mysql on metarang-shared.
# Redis here is Laravel-only (sessions/cache/queue) — do not point REDIS_HOST at the Go Redis.

x-php-image: &php-image ${PHP_IMAGE:-admin-panel-php:production}

x-app-volumes: &app-volumes
  - ${HOST_STORAGE_PATH:-/opt/metarang/storage}:${HOST_STORAGE_TARGET:-/var/www/html/storage}${HOST_STORAGE_OPTIONS:-}
  - ${HOST_DATABASE_PATH:-/opt/metarang/database}:${HOST_DATABASE_TARGET:-/var/www/html/database}${HOST_DATABASE_OPTIONS:-}
  - ./docker/php/production.ini:/usr/local/etc/php/conf.d/99-production.ini:ro

x-php-environment: &php-environment
  COMPOSER_CACHE_DIR: /tmp/composer-cache
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-error}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-metarang-mysql}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-metarang_db}
  DB_USERNAME: ${DB_USERNAME:-metarang_user}
  DB_PASSWORD: ${DB_PASSWORD:-}
  CACHE_DRIVER: ${CACHE_DRIVER:-redis}
  CACHE_STORE: ${CACHE_STORE:-redis}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}

x-app-common: &app-common
  image: *php-image
  restart: unless-stopped
  volumes: *app-volumes
  env_file:
    - path: .env
      required: false
  environment:
    <<: *php-environment
  init: true
  networks:
    - admin-panel-private
    - metarang-shared

services:
  app:
    <<: *app-common
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    pull_policy: build
    ports:
      - "${APP_PORT:-8088}:8080"
    environment:
      <<: *php-environment
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080", "--no-reload"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dokploy-network
      - admin-panel-private
      - metarang-shared
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot Vite build against the bind-mounted tree (profile: dev).
  node:
    image: node:22-alpine
    pull_policy: if_not_present
    restart: "no"
    working_dir: /var/www/html
    volumes:
      - ${HOST_STORAGE_PATH:-.}:/var/www/html:cached
      - node-modules:/var/www/html/node_modules
      - npm-cache:/root/.npm
    command: ["sh", "docker/scripts/build-assets.sh"]
    profiles:
      - dev
    networks:
      - admin-panel-private

  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - admin-panel-private

  queue:
    <<: *app-common
    pull_policy: never
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      <<: *php-environment
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - queue

  scheduler:
    <<: *app-common
    pull_policy: never
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    depends_on:
      app:
        condition: service_healthy
    profiles:
      - queue

networks:
  dokploy-network:
    external: true
  metarang-shared:
    name: metarang-shared
    external: true
  admin-panel-private:
    driver: bridge

volumes:
  node-modules:
  npm-cache:
  redis-data:
